# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      ports: [ 3306, 8080 ]

    steps:
    - name: Prepare MySQL env
      run: |
        apt-get update --yes
        apt-get install --yes libnuma1
        apt-get install --yes libaio1t64
        apt-get install --yes libncurses6
        ln -sf libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
    - name: Prepare Cypress env
      run: |
        apt-get update --yes
        apt-get install --yes libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
        apt-get install --yes bc bzip2 mplayer xz-utils
    - name: Prepare Firefox env
      run: |
        mkdir -p /opt
        cd /opt
        wget -qO- https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz | tar xzf -
        echo headless | sudo -S ln -fs /opt/geckodriver /usr/bin/geckodriver
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.16
    - name: Setup Firefox 155
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: 155.0.1
    - name: Build with Maven
      run: |
        # sed -i 's/firefox/electron/' pom.xml
        mvn clean verify --file pom.xml
